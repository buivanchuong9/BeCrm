# Production deployment target for the DermaHealth backend. Distinct from
# docker-compose.yml (local dev: bind-mounted source, --watch, dev seed).
#
# Usage on the Ubuntu host:
#   cp .env.example .env.production   # fill in real secrets, NODE_ENV=production
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml run --rm api npm run db:migrate
#
# Platform metadata initialization is intentionally not run automatically here.
# `npm run db:seed` is safe to invoke explicitly: it creates permission/feature
# metadata only and never inserts tenant, account or clinical records.
#
# MinIO/Mailpit are dev-only stand-ins and are deliberately not included here
# — point S3_*/SMTP_* in .env.production at real object storage and a real
# mail provider instead (see .env.example).

name: dermahealth

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-dermahealth}
    volumes:
      - dermahealth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-dermahealth}',
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
    # No host port published — reachable only from other containers on this
    # network. Use `docker compose -f docker-compose.prod.yml exec postgres psql ...`
    # for ad-hoc access instead of exposing 5432 publicly.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - dermahealth_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  ai:
    build:
      context: .
      dockerfile: ai/Dockerfile
      args:
        PYTORCH_INDEX_URL: ${PYTORCH_INDEX_URL:-https://download.pytorch.org/whl/cu126}
    container_name: dermahealth-ai
    restart: unless-stopped
    environment:
      AI_INTERNAL_API_KEY: ${AI_API_KEY:?set AI_API_KEY in .env.production}
      AI_REQUIRE_CUDA: 'true'
      AI_TORCH_THREADS: ${AI_TORCH_THREADS:-2}
      AI_MAX_CONCURRENT_CASES: ${AI_MAX_CONCURRENT_CASES:-1}
      AI_QUALITY_MIN_SCORE: ${AI_QUALITY_MIN_SCORE:-0.55}
      AI_MIN_TOP_PROBABILITY: ${AI_MIN_TOP_PROBABILITY:-0.60}
      AI_MIN_PROBABILITY_MARGIN: ${AI_MIN_PROBABILITY_MARGIN:-0.15}
      AI_MIN_BRIGHTNESS: ${AI_MIN_BRIGHTNESS:-0.12}
      AI_MAX_BRIGHTNESS: ${AI_MAX_BRIGHTNESS:-0.95}
      AI_MIN_BLUR_VARIANCE: ${AI_MIN_BLUR_VARIANCE:-0.001}
      AI_APPROVED_PREPROCESSING_VERSION: ${AI_APPROVED_PREPROCESSING_VERSION:-imagenet-eval-224-v1}
      NVIDIA_VISIBLE_DEVICES: ${AI_GPU_DEVICE:-0}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: dermahealth-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai:
        condition: service_healthy
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    environment:
      AI_SERVICE_URL: http://ai:8000
      AI_MAX_RESPONSE_BYTES: ${AI_MAX_RESPONSE_BYTES:-5000000}
    ports:
      # 127.0.0.1-only: nginx on the same host is the public entry point and
      # terminates TLS (see nginx/dermahealth.host.conf.example) — the app
      # port itself is never exposed to the internet directly.
      - '127.0.0.1:43000:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3000/health/live', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  dermahealth_postgres_data:
  dermahealth_redis_data:
